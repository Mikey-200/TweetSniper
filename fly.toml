# fly.toml — TweetSniper worker bot configuration
# Generated config has been replaced with worker-optimised settings
# See https://fly.io/docs/reference/configuration/

app = 'tweetsniper'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'

# Worker process — no HTTP server
# auto_stop disabled so the machine runs 24/7
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
