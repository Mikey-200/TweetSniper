# fly.toml — TweetSniper worker bot
# No HTTP service — this is a pure background worker process
# Fly.io will keep it running continuously without traffic-based auto-stop

app = "tweetsniper"
primary_region = "lhr"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8_080
min_machines_running = 1
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"
memory_mb = 256
