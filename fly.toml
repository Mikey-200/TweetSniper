# fly.toml — TweetSniper worker bot
# No HTTP service — pure background worker, no traffic-based auto-stop

app = 'tweetsniper'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8_080
min_machines_running = 1
processes = [ "app" ]

# Persistent volume — mounts to /app/data inside the container
# trades.csv and market_history.json survive redeploys here
[[mounts]]
  source = 'tweetsniper_data'
  destination = '/app/data'

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"
memory_mb = 256